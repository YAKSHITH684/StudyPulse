services:
  - type: web
    name: studypulse
    runtime: python
    plan: free
    buildCommand: "bash ./render-build.sh"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: NODE_VERSION
        value: 20.12.0
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
